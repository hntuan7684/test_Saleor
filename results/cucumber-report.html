window.CUCUMBER_MESSAGES = [{"meta":{"protocolVersion":"27.2.0","implementation":{"version":"11.3.0","name":"cucumber-js"},"cpu":{"name":"arm64"},"os":{"name":"darwin","version":"24.5.0"},"runtime":{"name":"node.js","version":"22.17.0"}}},{"source":{"data":"Feature: Design Tool\n  As a customer\n  I want to customize and manage my designs effectively\n  So that I can create the perfect product for my needs\n\n  Background:\n    Given I am on the design tool page\n\n  @DT001 @art-depot @logged-user\n  Scenario: Display art depot for logged users\n    Given I am logged in\n    When I access the design tool\n    Then I should see the art depot section\n    And I should see my previously used designs\n\n  @DT002 @art-depot @guest-user\n  Scenario: Hide art depot for non-logged users\n    Given I am not logged in\n    When I access the design tool\n    Then I should not see the art depot section\n    And I should see a message to log in for access\n\n  @DT003 @art-depot @management\n  Scenario: Save design to art depot\n    When I create a new design\n    And I save the design\n    Then the design should be saved to my art depot\n    And I should see a confirmation message\n\n  @DT004 @product-change @selection\n  Scenario: Change products in design tool\n    When I select a different product type\n    Then the design canvas should update\n    And the design should adapt to the new product\n\n  @DT005 @product-change @compatibility\n  Scenario: Maintain design compatibility when changing products\n    When I change from t-shirt to hoodie\n    Then my existing design should be preserved\n    And the design should be properly positioned\n\n  @DT006 @undo-redo @functionality\n  Scenario: Undo design changes\n    When I make multiple design changes\n    And I click the undo button\n    Then the last change should be reverted\n    And the design should return to the previous state\n\n  @DT007 @undo-redo @functionality\n  Scenario: Redo design changes\n    When I undo a design change\n    And I click the redo button\n    Then the change should be reapplied\n    And the design should return to the current state\n\n  @DT008 @undo-redo @history\n  Scenario: Maintain undo\/redo history\n    When I make several design changes\n    Then I should be able to undo multiple steps\n    And I should be able to redo multiple steps\n\n  @DT009 @print-area @positioning\n  Scenario: Adjust print area to 3 inches below collar\n    When I view the print area guidelines\n    Then the print area should be positioned 3 inches below the collar\n    And the measurement should be in inches\n\n  @DT010 @print-area @validation\n  Scenario: Validate design within print area\n    When I place design elements outside the print area\n    Then I should see a warning message\n    And the design should be constrained to the print area\n\n  @DT011 @print-area @multiple-areas\n  Scenario: Support multiple print areas\n    When I select different print areas (chest, back, sleeve)\n    Then each area should have its own design canvas\n    And the print areas should be clearly defined\n\n  @DT012 @design-tool @user-experience\n  Scenario: Intuitive design tool interface\n    When I use the design tool\n    Then the interface should be user-friendly\n    And all tools should be easily accessible\n    And the design preview should be clear ","uri":"features\/design-tool\/design-tool.feature","mediaType":"text\/x.cucumber.gherkin+plain"}},{"gherkinDocument":{"feature":{"tags":[],"location":{"line":1,"column":1},"language":"en","keyword":"Feature","name":"Design Tool","description":"  As a customer\n  I want to customize and manage my designs effectively\n  So that I can create the perfect product for my needs","children":[{"background":{"id":"5a13e158-dc94-4c1c-9baf-5b68722f59e3","location":{"line":6,"column":3},"keyword":"Background","name":"","description":"","steps":[{"id":"3bf4e0c1-62b3-4f9f-a7fe-dbe0da6f989e","location":{"line":7,"column":5},"keyword":"Given ","keywordType oceed to checkout\n\n  @OQ003 @validation @minimum-order\n  Scenario: Allow orders greater than 500 shirts\n    When I add more than 500 shirts to cart\n    Then the order should be accepted\n    And I should be able to proceed to checkout\n\n  @OQ004 @permission @small-order\n  Scenario: Display permission note for small orders\n    When I view the product page\n    Then I should see a note about minimum 500 orders\n    And the note should mention contacting support for smaller orders\n\n  @OQ005 @permission @keycloak\n  Scenario: Allow small orders with special permission\n    Given I am logged in with special permission\n    When I try to add less than 500 shirts to cart\n    Then the order should be accepted\n    And I should see a special permission indicator\n\n  @OQ006 @validation @error-handling\n  Scenario: Clear error message for quantity validation\n    When I enter an invalid quantity\n    Then I should see a clear error message\n    And the error should explain the minimum requirement\n\n  @OQ007 @navigation @support-redirect\n  Scenario: Redirect to support form for small orders\n    When I click on the support link for small orders\n    Then I should be redirected to the support form\n    And the form should be pre-filled with order inquiry\n\n  @OQ008 @ui @user-experience\n  Scenario: User-friendly interface for quantity restrictions\n    When I view the quantity input field\n    Then I should see helpful tooltips about minimum orders\n    And the interface should guide me to the correct quantity ","uri":"features\/order-quantity\/order-quantity-validation.feature","mediaType":"text\/x.cucumber.gherkin+plain"}},{"gherkinDocument":{"feature":{"tags":[],"location":{"line":1,"column":1},"language":"en","keyword":"Feature","name":"Order Quantity Validation","description":"  As a customer\n  I want the system to enforce minimum order quantities\n  So that bulk orders are properly managed","children":[{"background":{"id":"12ffe3b2-4a3d-4ee8-ba79-dad7f3eaa1 a-4fbb-9d6c-75e559a03f35"]}]}},{"source":{"data":"Feature: Payment Integration\n  As a customer\n  I want to complete payments securely through Stripe\n  So that I can purchase products with confidence\n\n  Background:\n    Given I am on the checkout page\n\n  @PI001 @payment @stripe-integration\n  Scenario: Complete payment with Stripe\n    When I enter valid payment information\n    And I submit the payment\n    Then the payment should be processed through Stripe\n    And I should receive a payment confirmation\n\n  @PI002 @payment @validation\n  Scenario: Validate payment information\n    When I enter invalid payment information\n    Then I should see validation errors\n    And the payment should not be processed\n\n  @PI003 @payment @card-validation\n  Scenario: Validate credit card details\n    When I enter an invalid credit card number\n    Then I should see a card validation error\n    And the form should highlight the invalid field\n\n  @PI004 @payment @expiry-validation\n  Scenario: Validate card expiry date\n    When I enter an expired card\n    Then I should see an expiry date error\n    And the payment should be rejected\n\n  @PI005 @payment @cvv-validation\n  Scenario: Validate CVV code\n    When I enter an invalid CVV\n    Then I should see a CVV validation error\n    And the payment should not proceed\n\n  @PI006 @payment @success-flow\n  Scenario: Successful payment flow\n    When I complete a successful payment\n    Then I should see a success message\n    And I should be redirected to the order confirmation page\n    And I should receive an order confirmation email\n\n  @PI007 @payment @error-handling\n  Scenario: Handle payment processing errors\n    When a payment processing error occurs\n    Then I should see a user-friendly error message\n    And I should be able to retry the payment\n\n  @PI008 @payment @security\n  Scenario: Secure payment processing\n    When I enter payment information\n    Then the data should be encrypted\n    And sensitive information should not be stored locally\n\n  @PI009 @payment @amount-validation\n  Scenario: Validate payment amount\n    When I attempt to pay an incorrect amount\n    Then I should see an amount validation error\n    And the correct amount should be displayed\n\n  @PI010 @payment @currency-handling\n  Scenario: Handle currency conversion\n    When I pay in a different currency\n    Then the currency should be converted correctly\n    And the exchange rate should be clearly displayed\n\n  @PI011 @payment @refund-process\n  Scenario: Process payment refunds\n    When I request a refund\n    Then the refund should be processed through Stripe\n    And I should receive a refund confirmation\n\n  @PI012 @payment @webhook-handling\n  Scenario: Handle Stripe webhooks\n    When Stripe sends a webhook notification\n    Then the order status should be updated accordingly\n    And the customer should be notified\n\n  @PI013 @payment @testing-mode\n  Scenario: Use Stripe test mode\n    When I use test payment credentials\n    Then the payment should be processed in test mode\n    And no real charges should be made\n\n  @PI014 @payment @mobile-responsive\n  Scenario: Mobile-responsive payment form\n    When I access the payment form on mobile\n    Then the form should be properly displayed\n    And all fields should be easily accessible ","uri":"features\/payment\/payment-integration.feature","mediaType":"text\/x.cucumber.gherkin+plain"}},{"gherkinDocument":{"feature":{"tags":[],"location":{"line":1,"column":1},"language":"en","keyword":"Feature","name":"Payment Integration","description":"  As a customer\n  I want to complete payments securely through Stripe\n  So that I can purchase products with confidence","children":[{"background":{"id":"74d52ced-5bf9-4080-b0ed-ef26df913a81","location":{"line":6,"column":3},"keyword":"Background","name":"","description":"","steps":[{"id":"ff0db48f-a851-4338-b716-5226690eae23","location":{"line":7,"column":5},"keyword":"Given ","keyword 04-4edf-a0d3-8b4006cc56e9","text":"all fields should be easily accessible","type":"Outcome","astNodeIds":["458c994a-53f8-48d7-8b7d-105e24603caa"]}]}},{"source":{"data":"Feature: Pricing System\n  As a customer\n  I want to see accurate pricing based on my login status and order details\n  So that I can make informed purchasing decisions\n\n  Background:\n    Given I am on the product detail page\n\n  @PR001 @pricing @guest-user\n  Scenario: Display Price A for non-logged users\n    Given I am not logged in\n    When I view the product pricing\n    Then I should see Price A category pricing\n    And the pricing should be based on quantity tiers\n\n  @PR002 @pricing @logged-user\n  Scenario: Display Price B for logged users\n    Given I am logged in\n    When I view the product pricing\n    Then I should see Price B category pricing\n    And the pricing should be more favorable than Price A\n\n  @PR003 @pricing @quantity-tiers\n  Scenario: Different prices based on quantity\n    When I change the quantity to different tiers\n    Then the price should update accordingly\n    And the pricing should follow the tier structure\n\n  @PR004 @pricing @screen-printing\n  Scenario: Calculate screen printing costs by colors\n    When I select 3 colors for front printing\n    And I select 1 color for back printing\n    Then the total printing cost should be $1.55\n    And the cost should be itemized by area\n\n  @PR005 @pricing @screen-printing\n  Scenario: Calculate printing costs for different areas\n    When I select printing for chest area\n    And I select printing for back area\n    Then the costs should be calculated separately\n    And the total should be the sum of all areas\n\n  @PR006 @pricing @coupon\n  Scenario: Apply coupon discount\n    When I enter a valid coupon code\n    Then the discount should be applied\n    And the final price should reflect the discount percentage\n\n  @PR007 @pricing @coupon\n  Scenario: Handle invalid coupon codes\n    When I enter an invalid coupon code\n    Then I should see an error message\n    And the price should remain unchanged\n\n  @PR008 @pricing @coupon\n  Scenario: Apply multiple coupons\n    When I apply multiple valid coupons\n    Then the system should handle the combination correctly\n    And the total discount should be calculated properly\n\n  @PR009 @pricing @real-time\n  Scenario: Real-time price updates\n    When I change product options\n    Then the price should update in real-time\n    And all calculations should be accurate\n\n  @PR010 @pricing @comparison\n  Scenario: Compare prices between logged and non-logged states\n    Given I am not logged in\n    When I note the current price\n    And I log in\n    Then I should see a different (better) price\n    And the difference should be clearly visible ","uri":"features\/pricing\/pricing-system.feature","mediaType":"text\/x.cucumber.gherkin+plain"}},{"gherkinDocument":{"feature":{"tags":[],"location":{"line":1,"column":1},"language":"en","keyword":"Feature","name":"Pricing System","description":"  As a customer\n  I want to see accurate pricing based on my login status and order details\n  So that I can make informed purchasing decisions","children":[{"background":{"id":"3c911e75-572a-445c-8ec2-fe97e8b92314","location":{"line":6,"column":3},"keyword":"Background","name":"","description":"","steps":[{"id":"bbad8f03-4c3e-4165-8a15-86714033aa45","location":{"line":7,"column":5},"keyword":"Given ","keywordType":"Context","text":"I am on the product detail page"}]}},{"scenario":{"id":"05d3560e-31d6-445b-bb9b-f3cdd7dd6cf2","tags":[{"location":{"line":9,"column":3},"name":"@PR001","id":"dc1d4a24-c8cf-4efd-987c-a39e1ac1732b"},{"location":{"line":9,"column":10},"name":"@pricing","id":"676f49cd-c0b2-4f07-80fe-4f0547c3241e"},{"location":{"line":9,"column":19},"name":"@guest-user","id":"4839fde2-3898-44ad-a162-69f28d805a30"}],"location":{"line":10,"column":3},"keyword":"Scenario","name":"Display Price A for non-logged users","description": n  #   When I select size \"M\"\n  #   And I set quantity to \"1\"\n  #   And I click \"Add to Cart\"\n  #   Then the product should be added to cart successfully\n\n  # @PD009 @validation\n  # Scenario: Verify Error message for invalid quantity\n  #   Given I am logged in as \"testaccount123@mailinator.com\"\n  #   When I clear the quantity field\n  #   And I click \"Add to Cart\"\n  #   Then I should see an error message \"Something went wrong. Please try again later\"\n\n  @PD010 @interaction\n  Scenario: Verify Product Images Carousel works correctly\n    When I click on a product image thumbnail\n    Then the main product image should change\n\n  @PD011 @content\n  Scenario: Verify Product Features list is displayed\n    Then the \"Features\" section should be visible\n    And the features list should contain at least one item\n\n  @PD012 @navigation\n  Scenario: Verify Breadcrumb navigation works\n    When I click on the \"Products\" breadcrumb link\n    Then I should be redirected to the products page\n\n  @PD013 @seo\n  Scenario: Verify Product URL is SEO friendly\n    Then the URL should contain \"bella-3001\"\n\n  @PD014 @interaction\n  Scenario: Verify Image changes with color selection\n    When I select a different color option\n    Then the product image should change to match the selected color\n\n  @PD015 @authentication\n  Scenario: Verify Add to Cart without selecting Size redirects to login\n    When I click \"Add to Cart\" without selecting size\n    Then I should be redirected to the login page\n\n  @PD016 @content\n  Scenario: Verify Product Description is displayed and formatted correctly\n    Then the \"Descriptions\" section should be visible\n    And the description should contain \"BELLA + CANVAS Jersey Tee\"\n\n  # @PD017 @navigation\n  # Scenario: Verify Customize Design button navigates correctly\n  #   When I click the \"Customize Design\" button\n  #   Then I should be redirected to the design page\n\n  @PD018 @layout\n  Scenario: Verify product detail page layout is responsive\n    When I view the product detail page on mobile screen\n    Then all product elements should be properly displayed\n\n  @PD019 @accessibility\n  Scenario: Verify product images have alt attributes\n    Then all product detail images should have alt attributes\n\n  @PD020 @interaction\n  Scenario: Verify quantity input accepts valid values\n    When I enter quantity \"5\"\n    Then the quantity should be set to \"5\"\n\n  @PD021 @validation\n  Scenario: Verify quantity input rejects invalid values\n    When I enter quantity \"-1\"\n    Then the quantity should not be accepted\n\n  @PD022 @content\n  Scenario: Verify product information is complete\n    Then the product should display title, price, and description\n    And all product images should load without errors\n\n  @PD023 @interaction\n  Scenario: Verify size selection updates product availability\n    When I select size \"L\"\n    Then the size \"L\" should be marked as selected\n\n  @PD024 @interaction\n  Scenario: Verify color selection updates product appearance\n    When I select a specific color\n    Then the selected color should be visually indicated\n\n  @PD025 @performance\n  Scenario: Verify product detail page loads within acceptable time\n    Then the page should load within 10 seconds ","uri":"features\/products\/product-detail.feature","mediaType":"text\/x.cucumber.gherkin+plain"}},{"gherkinDocument":{"feature":{"tags":[],"location":{"line":1,"column":1},"language":"en","keyword":"Feature","name":"Product Detail Page - Safe Testing","description":"  As a user\n  I want to view and interact with product details safely\n  So that I can make informed purchasing decisions without browser crashes","children":[{"background":{"id":"af8da387-cfd2-4831-a13c-6e8884823c82","location":{"line":6,"column":3},"keyword":"Background","name":"","description":"","steps":[{"id":"fafa0db2-d581-45ad-80b9-fcef902b5042","location":{"line":7,"column":5},"keyword":"Given ", ould be redirected to the home page\n\n  @PR002 @layout\n  Scenario: Products label is visible and correct\n    Then the \"Products\" label should be visible in the breadcrumb\n\n  @PR003 @interaction\n  Scenario: Home link has hover effect\n    When I hover over the Home link\n    Then the Home link should have a hover effect\n\n  @PR004 @layout\n  Scenario: Icons next to Home and Products are displayed\n    Then breadcrumb icons should be visible\n\n  @PR005 @layout\n  Scenario: Breadcrumb order is correct\n    Then the breadcrumb should show \"Home > Products\" in correct order\n\n  @PR006 @offline\n  Scenario: Clicking Home while offline\n    When I set the page to offline mode\n    And I click on the Home link\n    Then the page should handle offline navigation gracefully\n\n  @PR007 @accessibility\n  Scenario: Product list has ARIA label for accessibility\n    Then all product elements should have ARIA labels\n\n  @PR008 @interaction\n  Scenario: Products label does not trigger action\n    When I click on the \"Products\" label\n    Then I should remain on the products page\n\n  @PR009 @interaction\n  Scenario: No unexpected popup on Home hover\n    When I hover over the Home breadcrumb\n    Then no popup, tooltip, or modal should appear\n\n  @PR010 @content\n  Scenario: Product list displays at least one product\n    Then at least one product should be displayed\n\n  @PR011 @content\n  Scenario: Each product shows name and price correctly\n    Then products should display name and price information\n    And the price format should be \"From: $X.X\"\n\n  @PR012 @navigation\n  Scenario: Click product name navigates to detail page\n    When I click on the first product name\n    Then I should be redirected to the product detail page\n    And the product detail page should show the correct product name\n\n  @PR013 @content\n  Scenario: Product image loads correctly\n    Then the first product image should be visible and loaded\n\n  @PR014 @content\n  Scenario: Price format is correct\n    Then the first product price should match the format \"From: $X.X\"\n\n  @PR015 @interaction\n  Scenario: Hover on product enlarges card\n    When I hover over a product card\n    Then the product card should be enlarged\n\n  @PR016 @layout\n  Scenario: Products are displayed in a grid layout\n    Then products should be displayed in a grid layout\n    And the grid should have multiple columns\n\n  @PR017 @validation\n  Scenario: No broken product links\n    Then all product links should have valid href attributes\n\n  @PR018 @content\n  Scenario: No products displayed when list is empty\n    When I navigate to the products page with empty list\n    Then no products should be displayed\n\n  @PR019 @responsive\n  Scenario: Product page is responsive on mobile\n    When I view the products page on mobile screen\n    Then the product cards should be visible and properly displayed\n\n  @PR020 @layout\n  Scenario: Products label has correct font size and color\n    Then the \"Products\" label should have proper font size and color\n\n  @PR021 @interaction\n  Scenario: Hover on Home does not affect unrelated elements\n    When I hover on the Home link\n    Then unrelated product elements should remain unchanged\n\n  @PR022 @accessibility\n  Scenario: Product image has alt attribute\n    Then all product list images should have alt attributes\n\n  @PR023 @accessibility\n  Scenario: Keyboard navigation works on product cards\n    When I press Tab key multiple times\n    Then a product card should receive focus\n\n  @PR024 @accessibility\n  Scenario: Product cards are focusable via keyboard\n    Then all product cards should have tabindex attributes\n\n  @PR025 @responsive\n  Scenario: Product grid handles window resize properly\n    When I resize the window from desktop to tablet\n    Then the grid layout should adapt to the new size\n\n  @PR026 @content\n  Scenario: Broken image fallback is handled\n    When I navigate to the products page with b to my orders\n  So that I can save money on my purchases\n\n  Background:\n    Given I am on the checkout page\n\n  @PS001 @promotion @code-application\n  Scenario: Apply valid promotion code\n    When I enter a valid promotion code\n    And I apply the promotion\n    Then the discount should be applied to my order\n    And the final price should reflect the discount\n\n  @PS002 @promotion @validation\n  Scenario: Validate promotion code format\n    When I enter an invalid promotion code format\n    Then I should see a format validation error\n    And the promotion should not be applied\n\n  @PS003 @promotion @expiration\n  Scenario: Handle expired promotion codes\n    When I enter an expired promotion code\n    Then I should see an expiration error message\n    And the promotion should be rejected\n\n  @PS004 @promotion @usage-limits\n  Scenario: Respect promotion usage limits\n    When I try to use a promotion that has reached its usage limit\n    Then I should see a usage limit error\n    And the promotion should not be applied\n\n  @PS005 @promotion @minimum-order\n  Scenario: Enforce minimum order requirements for promotions\n    When I try to apply a promotion to an order below the minimum\n    Then I should see a minimum order requirement message\n    And the promotion should not be applied\n\n  @PS006 @promotion @percentage-discount\n  Scenario: Apply percentage-based discount\n    When I apply a percentage-based promotion\n    Then the discount should be calculated as a percentage\n    And the calculation should be accurate\n\n  @PS007 @promotion @fixed-discount\n  Scenario: Apply fixed amount discount\n    When I apply a fixed amount promotion\n    Then the discount should be a fixed amount\n    And the amount should be deducted from the total\n\n  @PS008 @promotion @multiple-promotions\n  Scenario: Handle multiple promotions\n    When I apply multiple valid promotions\n    Then the system should handle the combination correctly\n    And the total discount should be calculated properly\n\n  @PS009 @promotion @conflict-resolution\n  Scenario: Resolve promotion conflicts\n    When I apply conflicting promotions\n    Then the system should resolve conflicts appropriately\n    And I should be informed about the resolution\n\n  @PS010 @promotion @product-specific\n  Scenario: Apply product-specific promotions\n    When I apply a promotion for specific products\n    Then the discount should only apply to eligible products\n    And other products should remain at full price\n\n  @PS011 @promotion @user-specific\n  Scenario: Apply user-specific promotions\n    When I apply a promotion that is specific to my user account\n    Then the promotion should be validated against my account\n    And the discount should be applied if eligible\n\n  @PS012 @promotion @removal\n  Scenario: Remove applied promotion\n    When I remove an applied promotion\n    Then the discount should be removed\n    And the total price should be recalculated\n\n  @PS013 @promotion @display\n  Scenario: Display promotion information clearly\n    When I apply a promotion\n    Then the promotion details should be clearly displayed\n    And the savings amount should be visible\n\n  @PS014 @promotion @history\n  Scenario: Track promotion usage history\n    When I use a promotion\n    Then the usage should be tracked in my account\n    And I should be able to view my promotion history\n\n  @PS015 @promotion @auto-apply\n  Scenario: Auto-apply eligible promotions\n    When I have eligible promotions for my order\n    Then the system should suggest applicable promotions\n    And I should be able to apply them with one click ","uri":"features\/promotion\/promotion-system.feature","mediaType":"text\/x.cucumber.gherkin+plain"}},{"gherkinDocument":{"feature":{"tags":[],"location":{"line":1,"column":1},"language":"en","keyword":"Feature","name":"Promotion System","description":"  As a customer\n  I want to apply promotions and discounts to my orders\n  So that I can s ion errors\n    And the system should prevent order placement\n\n  @SM006 @order-splitting @automatic\n  Scenario: Automatically split orders by shipping address\n    When I upload a valid shipping list\n    Then the order should be split by address\n    And each address should have its own sub-order\n\n  @SM007 @shipping-cost @calculation\n  Scenario: Calculate shipping costs per address\n    When I upload a shipping list with multiple addresses\n    Then shipping costs should be calculated per address\n    And the total should include all shipping costs\n\n  @SM008 @shipping-cost @display\n  Scenario: Display shipping costs breakdown\n    When I view the shipping cost details\n    Then I should see costs for each address\n    And the breakdown should be expandable\n\n  @SM009 @order-management @sub-orders\n  Scenario: Create sub-orders for each shipping address\n    When the shipping list is processed\n    Then separate orders should be created for each address\n    And each sub-order should have its own tracking\n\n  @SM010 @inventory @management\n  Scenario: Handle inventory for split orders\n    When I place an order with multiple shipping addresses\n    Then inventory should be checked for the total quantity\n    And backorder warnings should be shown if needed\n\n  @SM011 @user-interface @upload\n  Scenario: User-friendly file upload interface\n    When I access the shipping list upload feature\n    Then the interface should be intuitive\n    And drag-and-drop should be supported\n\n  @SM012 @preview @confirmation\n  Scenario: Preview shipping information before order\n    When I upload a shipping list\n    Then I should see a preview of all addresses\n    And I should be able to edit or remove addresses\n\n  @SM013 @error-handling @file-issues\n  Scenario: Handle file upload errors gracefully\n    When I encounter a file upload error\n    Then I should see a clear error message\n    And I should be guided to resolve the issue\n\n  @SM014 @bulk-printing @optimization\n  Scenario: Optimize for bulk printing efficiency\n    When I place an order with multiple addresses\n    Then the system should group similar designs\n    And bulk printing should be optimized ","uri":"features\/shipping\/shipping-management.feature","mediaType":"text\/x.cucumber.gherkin+plain"}},{"gherkinDocument":{"feature":{"tags":[],"location":{"line":1,"column":1},"language":"en","keyword":"Feature","name":"Shipping Management","description":"  As a customer\n  I want to upload shipping lists for multiple locations\n  So that I can efficiently manage bulk orders to different addresses","children":[{"background":{"id":"5ab27c0e-8206-466a-90ff-0b3eb39e69c9","location":{"line":6,"column":3},"keyword":"Background","name":"","description":"","steps":[{"id":"87d87932-548d-4a64-b0e5-86506d39867c","location":{"line":7,"column":5},"keyword":"Given ","keywordType":"Context","text":"I am on the checkout page"}]}},{"scenario":{"id":"629f6fa0-6a93-475d-af4d-dbeaa0e8ef4a","tags":[{"location":{"line":9,"column":3},"name":"@SM001","id":"e080cf8c-2e9d-43cf-8f7d-cf399fa29d75"},{"location":{"line":9,"column":10},"name":"@file-upload","id":"7e50030d-f6a3-4b19-832d-060e01c76ec0"},{"location":{"line":9,"column":23},"name":"@csv","id":"bd1e02a8-c562-4b87-8f21-a1d3c3a50eec"}],"location":{"line":10,"column":3},"keyword":"Scenario","name":"Upload CSV shipping list","description":"","steps":[{"id":"22fbf327-154a-45fb-ba83-c7c512ae0ddb","location":{"line":11,"column":5},"keyword":"When ","keywordType":"Action","text":"I upload a valid CSV shipping list"},{"id":"8f0dd107-2c3b-4d50-bb32-5de12596417b","location":{"line":12,"column":5},"keyword":"Then ","keywordType":"Outcome","text":"the file should be accepted"},{"id":"db944478-fefc-4758-b46d-f70009197b4a","location":{"line":13,"column":5},"keyword":"And ","keywordType":"Conjunction","text":"the shipping addresses should be processed"}],"examples":[]}},{"scenario":{"id":"ce9302ac-bb0e-445b-bc9d-3bb8dbe96d39","tags":[{"location":{ o navigate through all fields using Tab key\n\n  @SP007 @happy-path\n  Scenario: Submit form with all valid data\n    When I fill the form with complete valid data\n    And I submit the form\n    Then I should see \"Support request created successfully\" message\n\n  @SP008 @validation @mandatory\n  Scenario: Submit form with only mandatory fields filled\n    When I fill only mandatory fields\n    And I submit the form\n    Then I should see error messages for missing required fields\n    And the form should not be submitted\n\n  @SP009 @validation @mandatory\n  Scenario: Submit form with all fields empty\n    When I submit the form without filling any fields\n    Then I should see error messages for all required fields\n    And the form should not be submitted\n\n  @SP010 @validation @mandatory\n  Scenario: Submit form with first name empty\n    When I fill all fields except first name\n    And I submit the form\n    Then I should see \"First name is required\" message\n\n  @SP011 @validation @mandatory\n  Scenario: Submit form with last name empty\n    When I fill all fields except last name\n    And I submit the form\n    Then I should see \"Last name is required\" message\n\n  @SP012 @validation @mandatory\n  Scenario: Submit form with details empty\n    When I fill all fields except details\n    And I submit the form\n    Then I should see \"Details are required\" message\n\n  @SP013 @validation @mandatory\n  Scenario: Submit form with email empty\n    When I fill all fields except email\n    And I submit the form\n    Then I should see \"Email is required\" message\n\n  @SP016 @validation @boundary\n  Scenario: First name with maximum length boundary\n    When I fill first name with maximum allowed length\n    And I submit the form\n    Then the form should be submitted successfully\n\n  @SP017 @validation @boundary\n  Scenario: First name exceeding maximum length\n    When I fill first name exceeding maximum allowed length\n    And I submit the form\n    Then I should see \"Failed to submit support request. Please try again\" message\n\n  @SP019 @validation @boundary\n  Scenario: Last name with maximum length boundary\n    When I fill last name with maximum allowed length\n    And I submit the form\n    Then the form should be submitted successfully\n\n  @SP020 @validation @boundary\n  Scenario: Last name exceeding maximum length\n    When I fill last name exceeding maximum allowed length\n    And I submit the form\n    Then I should see \"Failed to submit support request. Please try again\" message\n\n  @SP021 @validation @email\n  Scenario: Valid email format\n    When I fill the form with valid email format\n    And I submit the form\n    Then the form should be submitted successfully\n\n  @SP022 @validation @email\n  Scenario: Invalid email format\n    When I fill the form with invalid email format\n    And I submit the form\n    Then I should see \"Invalid email address\" message\n\n  @SP023 @validation @email\n  Scenario: Email with leading and trailing spaces\n    When I fill email with leading and trailing spaces\n    And I submit the form\n    Then the form should be submitted successfully\n\n  @SP024 @validation @email\n  Scenario: Email with invalid characters in domain\n    When I fill email with invalid characters in domain\n    And I submit the form\n    Then I should see \"Invalid email address\" message\n\n  @SP025 @validation @phone\n  Scenario: Valid phone number format\n    When I fill the form with valid phone number format\n    And I submit the form\n    Then the form should be submitted successfully\n\n  @SP026 @validation @phone\n  Scenario: Phone number with letters\n    When I fill phone number with letters\n    And I submit the form\n    Then I should see \"Please enter a valid phone number\" message\n\n  @SP027 @validation @phone\n  Scenario: Phone number with special characters\n    When I fill phone number with special characters\n    And I submit the form\n    Then I should see \"Please enter a valid phone number\" message\n\n  @SP028 @validation @phone\n  Scenario: Phone number with incorrect length\n    When I fill phone number with incorrect length\n    And I submit the form\n    Then I should see \"Please enter a valid phone number\" message\n\n  @SP030 @validation @company\n  Scenario: Company field accepts alphanumeric and common symbols\n    When I fill company field with alphanumeric and common symbols\n    And I submit the form\n    Then the form should be submitted successfully\n\n  @SP032 @security\n  Scenario: HTML\/JS injection attempt\n    When I fill all fields with HTML\/JS injection attempts\n    And I submit the form\n    Then no JavaScript alerts should be triggered\n    And the form should handle injection attempts safely\n\n  @SP033 @security\n  Scenario: SQL injection attempt\n    When I fill all fields with SQL injection attempts\n    And I submit the form\n    Then no database errors should be exposed\n    And the form should handle injection attempts safely ","uri":"features\/support\/support-form.feature","mediaType":"text\/x.cucumber.gherkin+plain"}},{"gherkinDocument":{"feature":{"tags":[],"location":{"line":1,"column":1},"language":"en","keyword":"Feature","name":"Support Form","description":"  As a user\n  I want to submit a support request\n  So that I can get help from the support team","children":[{"background":{"id":"7101c84b-4615-483a-acf1-866418bf5611","location":{"line":6,"column":3},"keyword":"Background","name":"","description":"","steps":[{"id":"c7ed33f2-0dc7-4442-96b2-bbf005e8e3cd","location":{"line":7,"column":5},"keyword":"Given ","keywordType":"Context","text":"I am on the support form page"}]}},{"scenario":{"id":"bcefd825-2656-4d50-9a73-46efe6b018a9","tags":[{"location":{"line":9,"column":3},"name":"@SP001","id":"d8f6359b-849d-4322-ac6f-75ed38fe57f2"},{"location":{"line":9,"column":10},"name":"@layout","id":"cb18e992-e8c8-4f3e-a311-c73101bd4a60"}],"location":{"line":10,"column":3},"keyword":"Scenario","name
